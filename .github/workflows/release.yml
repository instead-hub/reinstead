name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, e.g. 0.9. Defaults to VERSION from data/core/core.lua"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          VER='${{ inputs.version }}'
          if [ -z "$VER" ]; then
            VER=$(sed -n "s/^VERSION='\\(.*\\)'/\\1/p" data/core/core.lua)
          fi
          if [ -z "$VER" ]; then
            echo "Can not resolve version" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Check tag
        run: |
          VER='${{ steps.ver.outputs.version }}'
          if git ls-remote --exit-code --tags origin "$VER" >/dev/null 2>&1; then
            echo "Tag $VER already exists" >&2
            exit 1
          fi

  reinstead:
    name: reinstead
    needs: version
    uses: ./.github/workflows/reinstead.yml
    with:
      version: ${{ needs.version.outputs.version }}

  metaparser_js:
    name: metaparser-js
    needs: version
    uses: ./.github/workflows/metaparser-js.yml
    with:
      version: ${{ needs.version.outputs.version }}

  instead_cli:
    name: instead-cli
    needs: version
    uses: ./.github/workflows/instead-cli.yml
    with:
      version: ${{ needs.version.outputs.version }}

  draft:
    name: draft release
    runs-on: ubuntu-22.04
    needs: [version, reinstead, metaparser_js, instead_cli]
    steps:
      - uses: actions/checkout@v7

      - name: Download reinstead
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.reinstead.outputs.artifact }}
          path: dist

      - name: Download metaparser-js
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.metaparser_js.outputs.artifact }}
          path: dist

      - name: Download instead-cli
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.instead_cli.outputs.artifact }}
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER='${{ needs.version.outputs.version }}'
          gh release create "$VER" --draft --title "RE:INSTEAD $VER" --generate-notes \
            "dist/reinstead-$VER.zip" \
            "dist/reinstead-$VER-manual.pdf" \
            "dist/metaparser-js-$VER.zip" \
            "dist/instead-cli-$VER.zip"
