name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, e.g. 0.9. Defaults to VERSION from data/core/core.lua"
        required: false
        type: string

env:
  luajit_ver: 2.0.5
  sdl_ver: 2.32.10
  freetype_ver: 2.12.1
  mmd_ver: 5.4.0

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: release
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VER='${{ inputs.version }}'
          if [ -z "$VER" ]; then
            VER=$(sed -n "s/^VERSION='\\(.*\\)'/\\1/p" data/core/core.lua)
          fi
          if [ -z "$VER" ]; then
            echo "Can not resolve version" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Check tag
        run: |
          VER='${{ steps.ver.outputs.version }}'
          if git ls-remote --exit-code --tags origin "$VER" >/dev/null 2>&1; then
            echo "Tag $VER already exists" >&2
            exit 1
          fi

      - name: Cache libs
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: external
          key: libs-v2-${{ runner.os }}-${{ env.luajit_ver }}-${{ env.sdl_ver }}-${{ env.freetype_ver }}-${{ hashFiles('contrib/build-release.sh') }}

      - name: Cache manual
        id: cache-doc
        uses: actions/cache@v4
        with:
          path: doc-pdf
          key: doc-${{ hashFiles('doc/manual.md', 'doc/manual.tex', 'doc/preamble.tex', 'doc/Makefile', 'doc/img/**') }}

      - name: Install Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-i686 mingw-w64-i686-dev binutils-mingw-w64-i686 gcc-multilib wget zip
          sudo apt-get install -y build-essential

      - if: steps.cache-doc.outputs.cache-hit != 'true'
        name: Install latex
        run: |
          sudo apt-get install -y texlive-xetex texlive-latex-base texlive-latex-extra texlive-latex-recommended texlive-lang-cyrillic fonts-dejavu fonts-liberation

      - if: steps.cache-doc.outputs.cache-hit != 'true'
        name: Install multimarkdown
        run: |
          git clone --depth 1 --branch "$mmd_ver" https://github.com/fletcher/MultiMarkdown-5.git
          cd MultiMarkdown-5
          git submodule update --init --recursive
          make
          cd build
          sudo make install

      - if: steps.cache-doc.outputs.cache-hit != 'true'
        name: Create manual pdf
        run: |
          cd doc
          make && mkdir ../doc-pdf && cp manual.pdf ../doc-pdf

      - name: build
        run: |
          ./contrib/build-release.sh

      - name: Package
        run: |
          VER='${{ steps.ver.outputs.version }}'
          mkdir -p artifact
          (cd release && zip -r "../artifact/reinstead-$VER.zip" .)
          cp "doc-pdf/manual.pdf" "artifact/reinstead-$VER-manual.pdf"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER='${{ steps.ver.outputs.version }}'
          gh release create "$VER" --draft --title "RE:INSTEAD $VER" --generate-notes artifact/*

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reinstead-${{ steps.ver.outputs.version }}
          path: artifact
          retention-days: 7
