name: reinstead

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, e.g. 0.9. Defaults to VERSION from data/core/core.lua"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Release version/tag, e.g. 0.9. Defaults to VERSION from data/core/core.lua"
        required: false
        type: string
    outputs:
      artifact:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact }}
      version:
        description: "Resolved version"
        value: ${{ jobs.build.outputs.version }}

env:
  luajit_ver: 2.0.5
  sdl_ver: 3.4.16
  freetype_ver: 2.12.1
  mmd_ver: 6.8.0

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          VER='${{ inputs.version }}'
          if [ -z "$VER" ]; then
            VER=$(sed -n "s/^VERSION='\\(.*\\)'/\\1/p" data/core/core.lua)
          fi
          if [ -z "$VER" ]; then
            echo "Can not resolve version" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Cache libs
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: external
          key: libs-v3-${{ runner.os }}-${{ env.luajit_ver }}-${{ env.sdl_ver }}-${{ env.freetype_ver }}-${{ hashFiles('contrib/build-release*.sh') }}

      - name: Cache manual
        id: cache-doc
        uses: actions/cache@v6
        with:
          path: doc-pdf
          key: doc-${{ env.mmd_ver }}-${{ hashFiles('doc/manual.md', 'doc/manual.tex', 'doc/preamble.tex', 'doc/Makefile', 'doc/img/**') }}

      - name: Install Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 mingw-w64-i686-dev binutils-mingw-w64-i686 gcc-multilib wget zip
          sudo apt-get install -y build-essential cmake
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxrender-dev libdbus-1-dev libwayland-dev wayland-protocols libxkbcommon-dev libegl1-mesa-dev libdecor-0-dev

      - if: steps.cache-doc.outputs.cache-hit != 'true'
        name: Install latex
        run: |
          sudo apt-get install -y texlive-xetex texlive-latex-base texlive-latex-extra texlive-latex-recommended texlive-lang-cyrillic fonts-dejavu fonts-liberation

      - if: steps.cache-doc.outputs.cache-hit != 'true'
        name: Install multimarkdown
        run: |
          git clone --depth 1 --branch "$mmd_ver" https://github.com/fletcher/MultiMarkdown-6.git
          make -C MultiMarkdown-6 release
          make -C MultiMarkdown-6/build -j"$(nproc)"
          sudo cmake --install MultiMarkdown-6/build

      - if: steps.cache-doc.outputs.cache-hit != 'true'
        name: Create manual pdf
        run: |
          cd doc
          make && mkdir ../doc-pdf && cp manual.pdf ../doc-pdf

      - name: build
        run: |
          ./contrib/build-release-sdl3.sh

      - name: Package
        id: pack
        run: |
          VER='${{ steps.ver.outputs.version }}'
          rm -rf dist
          mkdir -p dist/reinstead
          cp -r release/. dist/reinstead/
          cp doc-pdf/manual.pdf dist/reinstead/doc/
          (cd dist && zip -r "reinstead-$VER.zip" reinstead)
          cp doc-pdf/manual.pdf "dist/reinstead-$VER-manual.pdf"
          echo "artifact=reinstead-$VER" >> "$GITHUB_OUTPUT"

      - name: Publish Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: dist
          retention-days: 7
