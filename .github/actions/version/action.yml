name: version
description: Resolve the release version from the input or from data/core/core.lua

inputs:
  version:
    description: "Release version/tag, e.g. 0.9. Defaults to VERSION from data/core/core.lua"
    required: false

outputs:
  version:
    description: "Resolved version"
    value: ${{ steps.ver.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve
      id: ver
      shell: bash
      run: |
        VER='${{ inputs.version }}'
        if [ -z "$VER" ]; then
          VER=$(sed -n "s/^VERSION='\\(.*\\)'/\\1/p" data/core/core.lua)
        fi
        if [ -z "$VER" ]; then
          echo "Can not resolve version" >&2
          exit 1
        fi
        echo "version=$VER" >> "$GITHUB_OUTPUT"
